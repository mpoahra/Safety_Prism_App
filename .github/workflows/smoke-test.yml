name: Safety Prism Smoke Test

on:
  push:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile app.py

      - name: Start application
        run: |
          nohup python app.py > app.log 2>&1 &
          sleep 5

      - name: Health check
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Reports API check
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/reports

      - name: Analytics API check
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/dashboard/analytics

      - name: Application log
        if: always()
        run: cat app.log || true
